# Configuración del servidor
server.port=8080

# Configuración de la Base de Datos MySQL usando variables de entorno para mayor seguridad
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:motoparts_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración de Spring Boot Actuator para Observabilidad
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always